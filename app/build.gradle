plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.bambutagger'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.bambutagger'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.2.1-safety'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
